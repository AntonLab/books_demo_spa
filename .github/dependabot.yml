version: 2
updates:
  # One lockfile at the root covers both workspaces.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # No labels: the repo's labels are the five triage roles, and Dependabot's
    # defaults would add ones outside that set.
    labels: []
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Majors the toolchain cannot take yet. Drop an entry once the packages
    # named beside it support the new major.
    ignore:
      # TypeScript 7 is the native compiler, without the JavaScript API that
      # typescript-eslint (typescript <6.1.0) and fork-ts-checker-webpack-plugin
      # load.
      - dependency-name: typescript
        versions: ['>=7']
      # ESLint 10 is past the range eslint-plugin-react and
      # eslint-plugin-jsx-a11y declare. @eslint/js moves with eslint.
      - dependency-name: eslint
        versions: ['>=10']
      - dependency-name: '@eslint/js'
        versions: ['>=10']
      # @types/node follows the Node floor (`engines.node` in the root
      # package.json): a newer major types APIs Node 24 does not have. Raise
      # it by hand, together with the floor.
      - dependency-name: '@types/node'
        versions: ['>=25']

  # Keeps the commit SHAs the workflows pin their actions to up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: []
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
